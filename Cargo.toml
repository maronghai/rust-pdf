[package]
name = "rust-pdf"
version = "0.1.0"
edition = "2024"
description = "A fast PDF viewer built with GPUI and Hayro"
license = "MIT"

[dependencies]
gpui = "0.2.2"
hayro = { version = "0.9.0", features = ["embed-fonts", "embed-cmaps"] }
rfd = "0.18.0"
image = { version = "0.25.1", default-features = false }
smallvec = { version = "1.13", features = ["union"] }
async-channel = "2"

[build-dependencies]
embed-resource = "3"

# Hayro rasterizes on the CPU, so keep dependencies optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 3
